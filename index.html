<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum State Interface</title>
    <style>
      :root {
        --bg-primary: #0a0a0c;
        --bg-secondary: #121216;
        --accent-gold: #d4af37;
        --accent-gold-dim: rgba(212, 175, 55, 0.15);
        --text-primary: #f8f9fa;
        --text-secondary: #a0a0a5;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .ambient-bg {
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 30% 40%,
            var(--accent-gold-dim) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 70% 60%,
            rgba(212, 175, 55, 0.05) 0%,
            transparent 40%
          );
        animation: ambientShift 20s infinite alternate ease-in-out;
        z-index: 0;
      }

      @keyframes ambientShift {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        100% {
          transform: translate(-5%, -5%) rotate(3deg);
        }
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1200px;
        padding: 2rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transition:
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.4s ease;
      }

      .glass-panel:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 48px rgba(212, 175, 55, 0.1);
        border-color: rgba(212, 175, 55, 0.2);
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 300;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          var(--text-primary) 0%,
          var(--accent-gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-top: 2rem;
      }

      .metric-card {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 1.5rem;
      }

      .metric-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
      }

      .metric-value {
        font-size: 1.8rem;
        font-weight: 600;
        color: var(--accent-gold);
        font-variant-numeric: tabular-nums;
      }

      .action-btn {
        margin-top: 2rem;
        width: 100%;
        padding: 1rem;
        background: linear-gradient(
          135deg,
          var(--accent-gold) 0%,
          #b8962e 100%
        );
        border: none;
        border-radius: 12px;
        color: var(--bg-primary);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .action-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.5s ease;
      }

      .action-btn:hover::before {
        left: 100%;
      }

      .action-btn:active {
        transform: scale(0.98);
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient-bg"></div>
    <div class="container">
      <div class="glass-panel">
        <h1>System Telemetry</h1>
        <p style="color: var(--text-secondary); line-height: 1.6">
          Real-time distributed state synchronization and predictive caching
          algorithm execution.
        </p>
        <div class="metric-grid">
          <div class="metric-card">
            <div class="metric-label">Throughput</div>
            <div class="metric-value" id="metric-throughput">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Latency (ms)</div>
            <div class="metric-value" id="metric-latency">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Cache Hit</div>
            <div class="metric-value" id="metric-cache">0%</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Uptime</div>
            <div class="metric-value" id="metric-uptime">99.99%</div>
          </div>
        </div>
      </div>
      <div class="glass-panel">
        <h1>Execution Control</h1>
        <p style="color: var(--text-secondary); line-height: 1.6">
          Initialize the reactive proxy algorithm to bind DOM elements directly
          to the underlying state machine.
        </p>
        <button class="action-btn" id="btn-execute">Initialize Sequence</button>
        <div
          id="log-output"
          style="
            margin-top: 1.5rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            height: 150px;
            overflow-y: auto;
          "
        ></div>
      </div>
    </div>

    <script>
      // Reactive State Management Algorithm
      const ReactiveState = (initialState) => {
        const listeners = new Map();

        const handler = {
          get(target, prop) {
            if (!listeners.has(prop)) listeners.set(prop, new Set());
            if (ReactiveState.currentEffect) {
              listeners.get(prop).add(ReactiveState.currentEffect);
            }
            return target[prop];
          },
          set(target, prop, value) {
            if (target[prop] === value) return true;
            target[prop] = value;
            if (listeners.has(prop)) {
              listeners.get(prop).forEach((effect) => effect());
            }
            return true;
          }
        };
        return new Proxy(initialState, handler);
      };

      const effect = (fn) => {
        ReactiveState.currentEffect = fn;
        fn();
        ReactiveState.currentEffect = null;
      };

      // Application State
      const state = ReactiveState({
        throughput: 0,
        latency: 0,
        cacheHit: 0,
        isRunning: false
      });

      // DOM Bindings
      const dom = {
        throughput: document.getElementById("metric-throughput"),
        latency: document.getElementById("metric-latency"),
        cache: document.getElementById("metric-cache"),
        btn: document.getElementById("btn-execute"),
        log: document.getElementById("log-output")
      };

      // Reactive Effects
      effect(() => {
        dom.throughput.textContent = state.throughput.toLocaleString();
      });
      effect(() => {
        dom.latency.textContent = state.latency.toFixed(2);
      });
      effect(() => {
        dom.cache.textContent = `${state.cacheHit}%`;
      });

      // Logging Utility
      const log = (msg) => {
        const time = new Date().toLocaleTimeString();
        dom.log.innerHTML += `<div>[${time}] ${msg}</div>`;
        dom.log.scrollTop = dom.log.scrollHeight;
      };

      // Simulation Algorithm
      let intervalId;
      const runSimulation = () => {
        if (state.isRunning) return;
        state.isRunning = true;
        dom.btn.textContent = "Sequence Active";
        dom.btn.style.opacity = "0.7";
        log("Initializing reactive proxy...");

        intervalId = setInterval(() => {
          state.throughput = Math.floor(Math.random() * 50000) + 10000;
          state.latency = Math.random() * 15 + 2;
          state.cacheHit = Math.floor(Math.random() * 20) + 80;
        }, 100);

        log("WebSocket gateway connected.");
        log("Python FastAPI aggregation active.");
        log("Java transactional layer synchronized.");
      };

      dom.btn.addEventListener("click", runSimulation);
    </script>
  </body>
</html>
